name: numi
description: NUMI AI Math
publish_to: "none"
version: 0.1.0+8

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  device_info_plus: ^13.2.0
  flutter_secure_storage: ^10.3.1
  json_annotation: ^4.12.0
  google_fonts: ^8.2.0
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/images/signup_screen/
    - assets/images/welcome_screen/
    - assets/sounds/effects/
