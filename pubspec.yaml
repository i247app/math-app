name: numi
description: NUMI AI Math
publish_to: "none"
version: 0.1.0+54

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  json_annotation: ^4.12.0
  google_fonts: ^9.0.0
  package_info_plus: ^10.2.2
  flutter_svg: ^2.3.0
  flutter_math_fork: ^0.7.4
  audioplayers: ^6.8.1
  # Must match the reviewed Android patch in third_party/android_gradle/patches.json.
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: ^22.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/images/numi-assessment-animation-mascot.png
    - assets/images/assessment_intro/
    - assets/icons/
    - assets/sounds/effects/
