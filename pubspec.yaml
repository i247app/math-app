name: numi
description: NUMI AI Math
publish_to: "none"
version: 0.1.0+43

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  device_info_plus: ^13.2.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  json_annotation: ^4.12.0
  google_fonts: ^8.2.1
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
    - assets/images/numi-assessment-animation-mascot.png
    - assets/images/assessment_intro/
    - assets/icons/
    - assets/sounds/effects/
