name: math_ai_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.5
  json_annotation: ^4.9.0
  http: ^1.3.0
  auto_hide_keyboard: ^1.0.1
  auto_size_text: ^3.0.0
  modal_bottom_sheet: ^3.0.0
  url_launcher: ^6.3.1
  flutter_google_places_sdk: ^0.4.0
  intl: ^0.20.2
  geolocator: ^13.0.3
  google_geocoding_api: ^1.5.2
  carousel_slider: ^5.1.1
  provider: ^6.1.4
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  intl_phone_number_input: ^0.7.4
  otp_pin_field: ^1.4.1
  http_interceptor: ^2.0.0
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^19.1.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.6
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  font_awesome_metadata: ^1.0.1
  flutter_iconly: ^1.0.2
  otp_timer_button: ^1.1.1
  loading_indicator: ^3.1.1
  shared_preferences: ^2.5.3
  dropdown_button2: ^2.3.9
  action_slider: ^0.7.0
  path_provider: ^2.1.5
  another_flushbar: ^1.12.30
  progress_bar_steppers: ^0.0.2+2
  email_validator: ^3.0.0
  currency_text_input_formatter: ^2.3.0
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  freezed: ^2.4.6
  slider_captcha: ^1.0.2

  bloc: ^8.1.4
  equatable: ^2.0.7
  share_plus: ^12.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  baseflow_plugin_template: ^2.2.0
  uuid: ^4.5.1
  fast_cached_network_image: ^1.3.3+5
  file_picker: ^10.2.0
  mime: ^2.0.0
  app_links: ^6.4.0
  webview_flutter: ^4.13.0
  local_auth: ^2.3.0
  flutter_biometric_change_detector: ^1.0.3
  encrypt: ^5.0.3
  multi_select_flutter: ^4.1.3
  video_player: ^2.10.0
  plaid_flutter: ^5.0.5
  vibration: ^3.1.4
  flutter_pdfview: ^1.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.3
  rename_app: ^1.6.3
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  android_notification_icons: ^0.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  #adaptive_icon_background: "#F9F6F6FF"  # Transparent background
  #adaptive_icon_foreground: "assets/logos/logo.png"

flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/imgs/
    - assets/fonts/
    - assets/logos/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 700
